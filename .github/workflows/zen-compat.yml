name: Zen compatibility

# Installs Sine into the newest Zen release and Twilight build, opens the
# settings page headlessly and checks that the Sine Mods pane is injected.
# Each Zen build is tested once per Sine commit; a failure opens (or comments
# on) a "zen-compat" issue. When the stable (beta) build fails, Claude Code then
# tries to fix Sine and opens a PR (needs the CLAUDE_CODE_OAUTH_TOKEN or
# ANTHROPIC_API_KEY repository secret).

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        description: "Test even if this Zen build already passed"
        default: false

permissions:
  contents: read

concurrency:
  group: zen-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Zen ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # auto-fix pushes a branch
      issues: write
      pull-requests: write # auto-fix opens a PR
      id-token: write # claude-code-action authentication
    env:
      HAS_CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [beta, twilight]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Zen build
        id: zen
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          if [[ "$CHANNEL" == "beta" ]]; then
            build="$(gh api repos/zen-browser/desktop/releases/latest --jq .tag_name)"
          else
            # Twilight is republished under the same tag, so key it by asset upload time.
            build="$(gh api repos/zen-browser/desktop/releases/tags/twilight-1 \
              --jq '.assets[] | select(.name == "zen.linux-x86_64.tar.xz") | .updated_at')"
          fi
          if [[ -z "$build" ]]; then
            echo "Could not resolve the Zen $CHANNEL build" >&2
            exit 1
          fi
          echo "Zen $CHANNEL build: $build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "key=zen-compat-$CHANNEL-${build//[^A-Za-z0-9._-]/_}-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Check if this build was already tested
        id: tested
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zen-compat-passed
          key: ${{ steps.zen.outputs.key }}
          lookup-only: true

      - name: Install bun
        if: steps.tested.outputs.cache-hit != 'true' || inputs.force
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.tested.outputs.cache-hit != 'true' || inputs.force
        run: bun ci

      - name: Run settings smoke test
        id: smoke
        if: steps.tested.outputs.cache-hit != 'true' || inputs.force
        env:
          CHANNEL: ${{ matrix.channel }}
        shell: bash
        run: scripts/smoke_test.sh "zen-$CHANNEL" smoke-result.json 2>&1 | tee smoke.log

      - name: Upload smoke test output
        if: always() && steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zen-compat-${{ matrix.channel }}
          path: |
            smoke-result.json
            smoke.log
          if-no-files-found: ignore

      - name: Remember passing build
        if: steps.smoke.outcome == 'success'
        run: touch .zen-compat-passed

      - name: Save passing build
        if: steps.smoke.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zen-compat-passed
          key: ${{ steps.zen.outputs.key }}

      - name: Report failure
        id: report
        if: failure() && steps.smoke.outcome == 'failure' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ matrix.channel }}
          BUILD: ${{ steps.zen.outputs.build }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create zen-compat --color e87757 \
            --description "Sine broken by a new Zen build" 2>/dev/null || true

          title="Sine does not load in the Zen $CHANNEL settings page"
          {
            echo "The scheduled compatibility check failed for Zen **$CHANNEL** (\`$BUILD\`)."
            echo
            echo '```json'
            cat smoke-result.json 2>/dev/null || echo '{"error": "no result written"}'
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } > body.md

          existing="$(gh issue list --label zen-compat --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file body.md
          else
            url="$(gh issue create --title "$title" --label zen-compat --body-file body.md)"
            existing="${url##*/}"
          fi
          echo "issue=$existing" >> "$GITHUB_OUTPUT"

      - name: Skip auto-fix if a fix PR is already open
        id: open-fix
        if: failure() && steps.report.outcome == 'success' && matrix.channel == 'beta' && env.HAS_CLAUDE_CREDENTIALS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count="$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("zen-compat/"))] | length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Auto-fix with Claude Code
        if: failure() && steps.open-fix.outputs.count == '0'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ steps.report.outputs.issue }}
            ZEN BUILD: ${{ steps.zen.outputs.build }} (stable channel, "zen-beta" in browsercfg)

            Sine is a mod manager injected into Zen Browser's settings page. The
            settings smoke test just failed against the Zen build above. The result
            is in smoke-result.json and the browser output in smoke.log (both in the
            working directory). The test itself is tests/smoke/settings.smoke.js and
            the runner is scripts/smoke_test.sh.

            1. Work out what Zen changed. Zen's source is at
               https://github.com/zen-browser/desktop (shallow-clone the tag of the
               build above); the settings page lives under
               src/browser/components/preferences and mods under src/zen/mods.
               Compare it with what src/core/settings.mjs, src/core/browser.mjs and
               src/services/ rely on (element IDs, globals such as gZenMods,
               gCategoryInits, window actors).
            2. Fix Sine in src/ so it works with the new build. Keep the fix minimal
               and keep compatibility with older Zen builds where practical.
               Do not edit the smoke test to make it pass, and do not edit
               .github/workflows.
            3. Verify: `scripts/smoke_test.sh zen-beta smoke-result.json` must
               report "passed": true. Also run `bun fmt` and `bun lint`.
            4. Commit on a new branch named zen-compat/fix-${{ github.run_id }},
               push it, and open a pull request against the default branch with
               `gh pr create`. Explain what Zen changed and how the fix handles it,
               and include "Fixes #${{ steps.report.outputs.issue }}".
               If `gh pr create` is refused because GitHub Actions is not allowed
               to create pull requests in this repository, comment on issue
               #${{ steps.report.outputs.issue }} instead with the explanation and
               this link to open the PR in one click:
               ${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...zen-compat/fix-${{ github.run_id }}?expand=1

            If you cannot find or verify a fix, do not open a PR; instead comment on
            issue #${{ steps.report.outputs.issue }} with what you found.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr:*),Bash(gh issue comment:*),Bash(bun:*),Bash(bunx:*),Bash(scripts/smoke_test.sh:*),Bash(cat:*),Bash(ls:*),Bash(grep:*),Bash(diff:*)"
